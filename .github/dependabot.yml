# Dependabot — supply-chainonderhoud.
#
# Actief is alleen "github-actions": dat ecosysteem bestaat in deze template al.
# De overige ecosystemen staan bewust uitgecommentarieerd; Dependabot geeft een fout
# wanneer een directory of manifest niet bestaat. Haal het juiste blok uit commentaar
# zodra [TECH STACK] is gekozen en het manifest in de repository staat.
#
# Documentatie: https://docs.github.com/code-security/dependabot
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 5
    labels:
      - "type:technical-task"
      - "type:security"
      - "priority:medium"
    commit-message:
      prefix: "ci"
      include: "scope"
    # reviewers:
    #   - "[ORG]/security"

