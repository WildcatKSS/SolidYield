# Bron van waarheid voor labels.
# Wordt toegepast door .github/workflows/labels-sync.yml (handmatig te starten).
# Kleuren zonder '#'.

# --- Itemtype (backloghiërarchie) ---
- name: "type:epic"
  color: "5319E7"
  description: "Grote samenhangende brok waarde onder een productdoel"
- name: "type:feature"
  color: "7057FF"
  description: "Samenhangende functionaliteit binnen een epic"
- name: "type:user-story"
  color: "1D76DB"
  description: "Waarde vanuit gebruikersperspectief (Als ... wil ik ... zodat ...)"
- name: "type:bug"
  color: "D73A4A"
  description: "Werkt niet zoals bedoeld"
- name: "type:technical-task"
  color: "0E8A16"
  description: "Technische taak zonder directe gebruikerswaarde"
- name: "type:research"
  color: "FBCA04"
  description: "Spike of gebruikersonderzoek, tijdgebonden"
- name: "type:security"
  color: "B60205"
  description: "Securitywerk of securityrisico (geen gevoelige details in issues)"
- name: "type:privacy"
  color: "C2185B"
  description: "Privacy, gegevensbescherming, rechten van betrokkenen"
- name: "type:compliance"
  color: "8B4513"
  description: "Compliance, controls, bewijsvoering, audit"
- name: "type:documentation"
  color: "0075CA"
  description: "Documentatie"

# --- Prioriteit ---
- name: "priority:critical"
  color: "B60205"
  description: "Nu oppakken; blokkeert gebruikers, geld of veiligheid"
- name: "priority:high"
  color: "D93F0B"
  description: "Deze sprint"
- name: "priority:medium"
  color: "FBCA04"
  description: "Binnen enkele sprints"
- name: "priority:low"
  color: "C2E0C6"
  description: "Wenselijk, niet urgent"

# --- Risico ---
- name: "risk:high"
  color: "B60205"
  description: "Hoog risico: geld, persoonsgegevens, toegang of compliance"
- name: "risk:medium"
  color: "FBCA04"
  description: "Middelmatig risico"
- name: "risk:low"
  color: "C2E0C6"
  description: "Laag risico"

# --- Status en proces ---
- name: "status:blocked"
  color: "000000"
  description: "Geblokkeerd; blokkade staat in het issue beschreven"
- name: "feedback:test-group"
  color: "006B75"
  description: "Afkomstig uit of bestemd voor validatie met de testgroep"
- name: "good-first-issue"
  color: "7057FF"
  description: "Geschikt voor een nieuwe bijdrager"

# --- Optioneel, aanbevolen aanvullingen ---
- name: "needs:refinement"
  color: "BFD4F2"
  description: "Voldoet nog niet aan de Definition of Ready"
- name: "needs:decision"
  color: "E99695"
  description: "Wacht op een beslissing van PO, security, privacy of compliance"
- name: "needs:legal-review"
  color: "5319E7"
  description: "Te valideren door een bevoegde juridische of compliancespecialist"
- name: "accessibility"
  color: "0052CC"
  description: "Toegankelijkheid (WCAG)"
- name: "tech-debt"
  color: "D4C5F9"
  description: "Technische schuld"
